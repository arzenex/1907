<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Surprise ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .video-container {
            width: 90%;
            max-width: 800px;
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(214, 158, 46, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #000;
            line-height: 0;
        }

        video {
            width: 100%;
            height: auto;
        }

        .header {
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            margin: 0;
            background: linear-gradient(to bottom, #cf995f, #f1de83);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .controls-area {
            margin-top: 40px;
            display: flex;
            gap: 20px;
        }

        .btn {
            padding: 12px 30px;
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(to bottom, #cf995f, #ad7f35);
            border: none;
            box-shadow: 0 0 15px rgba(214, 158, 46, 0.3);
        }

        .btn:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-primary:hover {
            box-shadow: 0 0 25px rgba(214, 158, 46, 0.5);
            background: linear-gradient(to bottom, #dfa96f, #bd8f45);
        }

        .footer-note {
            margin-top: 20px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>The Big Surprise ✨</h1>
    </div>

    <div class="video-container">
        <video id="surpriseVideo" controls autoplay muted playsinline>
            <source src="https://zblqrxnllqvmipzjyihv.supabase.co/storage/v1/object/public/ramukaka/output22.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <div class="controls-area">
        <button onclick="window.location.href='prank.html?retry=true'" class="btn btn-primary">Try Again ↺</button>
    </div>

    <div class="footer-note">Enjoy your special day!</div>

    <script>
        // Alert the user if the external video link fails to load
        const video = document.getElementById('surpriseVideo');
        video.addEventListener('error', function() {
            alert("The surprise video could not be loaded. Please check the source URL or your internet connection.");
        }, true);
    </script>
</body>
</html>
